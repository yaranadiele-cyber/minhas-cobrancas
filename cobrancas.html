<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinhasCobranças</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rosa: #e8547a;
    --rosa-claro: #fde8ef;
    --rosa-escuro: #c03460;
    --verde: #1d9e75;
    --verde-claro: #e1f5ee;
    --amarelo: #ba7517;
    --amarelo-claro: #faeeda;
    --vermelho: #a32d2d;
    --vermelho-claro: #fcebeb;
    --cinza: #888780;
    --cinza-claro: #f8f6f3;
    --cinza-borda: #e2ddd8;
    --texto: #2c2c2a;
    --texto-muted: #888780;
    --branco: #ffffff;
    --sombra: 0 2px 12px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #fdf9f7;
    color: var(--texto);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--branco);
    border-bottom: 1px solid var(--cinza-borda);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--rosa);
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--texto); }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--cinza-claro);
    border-radius: 10px;
    padding: 4px;
  }

  .tab-btn {
    padding: 6px 18px;
    border: none;
    background: transparent;
    border-radius: 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--texto-muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab-btn.active {
    background: var(--branco);
    color: var(--rosa);
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  /* MAIN */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  /* CARDS RESUMO */
  .resumo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 2rem;
  }

  .resumo-card {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: 14px;
    padding: 1.25rem;
    transition: transform 0.2s;
  }

  .resumo-card:hover { transform: translateY(-1px); }

  .resumo-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--texto-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .resumo-valor {
    font-size: 22px;
    font-weight: 600;
    color: var(--texto);
    font-variant-numeric: tabular-nums;
  }

  .resumo-card.verde .resumo-valor { color: var(--verde); }
  .resumo-card.vermelho .resumo-valor { color: var(--vermelho); }
  .resumo-card.amarelo .resumo-valor { color: var(--amarelo); }
  .resumo-card.rosa .resumo-valor { color: var(--rosa); }

  /* FORMULÁRIO */
  .form-section {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: 16px;
    padding: 1.75rem;
    margin-bottom: 2rem;
  }

  .form-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 1.25rem;
    color: var(--texto);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .form-title::before {
    content: '';
    width: 4px;
    height: 22px;
    background: var(--rosa);
    border-radius: 2px;
    display: block;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 14px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 13px;
    font-weight: 500;
    color: var(--texto-muted);
  }

  input, textarea, select {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 9px 13px;
    border: 1px solid var(--cinza-borda);
    border-radius: 9px;
    background: var(--cinza-claro);
    color: var(--texto);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    width: 100%;
  }

  input:focus, textarea:focus, select:focus {
    border-color: var(--rosa);
    background: var(--branco);
  }

  textarea { resize: vertical; min-height: 70px; }

  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 22px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .btn-primary {
    background: var(--rosa);
    color: white;
  }

  .btn-primary:hover { background: var(--rosa-escuro); transform: translateY(-1px); }

  .btn-ghost {
    background: transparent;
    color: var(--texto-muted);
    border: 1px solid var(--cinza-borda);
  }

  .btn-ghost:hover { background: var(--cinza-claro); color: var(--texto); }

  .btn-verde {
    background: var(--verde);
    color: white;
    font-size: 13px;
    padding: 7px 14px;
  }

  .btn-verde:hover { background: #0f6e56; }

  .btn-whatsapp {
    background: #25d366;
    color: white;
    font-size: 13px;
    padding: 7px 14px;
  }

  .btn-whatsapp:hover { background: #1da851; }

  .btn-danger {
    background: transparent;
    color: var(--vermelho);
    border: 1px solid #f7c1c1;
    font-size: 13px;
    padding: 7px 14px;
  }

  .btn-danger:hover { background: var(--vermelho-claro); }

  /* LISTA */
  .lista-section { display: flex; flex-direction: column; gap: 14px; }

  .busca-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  .busca-row input {
    flex: 1;
    min-width: 180px;
  }

  /* CARD CLIENTE */
  .cliente-card {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: 14px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .cliente-card:hover { box-shadow: var(--sombra); }

  .cliente-header {
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--rosa-claro);
    color: var(--rosa-escuro);
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .cliente-info { flex: 1; }

  .cliente-nome {
    font-weight: 600;
    font-size: 15px;
    color: var(--texto);
    margin-bottom: 3px;
  }

  .cliente-meta {
    font-size: 12px;
    color: var(--texto-muted);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .badge-verde { background: var(--verde-claro); color: #0f6e56; }
  .badge-vermelho { background: var(--vermelho-claro); color: var(--vermelho); }
  .badge-amarelo { background: var(--amarelo-claro); color: #633806; }

  .chevron {
    font-size: 18px;
    color: var(--cinza);
    transition: transform 0.3s;
  }

  .cliente-card.aberto .chevron { transform: rotate(180deg); }

  .cliente-body {
    display: none;
    padding: 0 1.25rem 1.25rem;
    border-top: 1px solid var(--cinza-borda);
  }

  .cliente-card.aberto .cliente-body { display: block; }

  /* PROGRESSO */
  .progresso-section {
    margin: 1rem 0;
  }

  .progresso-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
  }

  .barra-container {
    height: 8px;
    background: var(--cinza-claro);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .barra-fill {
    height: 100%;
    background: var(--rosa);
    border-radius: 4px;
    transition: width 0.5s ease;
  }

  .barra-fill.completo { background: var(--verde); }

  /* PAGAMENTOS */
  .pagamentos-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--texto-muted);
    margin: 1rem 0 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .pagamento-form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: flex-end;
    margin-bottom: 10px;
  }

  .pagamento-form .form-group {
    flex: 1;
    min-width: 120px;
  }

  .pagamento-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 10px;
    border-radius: 8px;
    background: var(--verde-claro);
    margin-bottom: 6px;
    font-size: 13px;
  }

  .pagamento-valor { font-weight: 600; color: #0f6e56; }
  .pagamento-data { color: #1d9e75; font-size: 12px; }

  .pagamento-delete {
    background: none;
    border: none;
    color: var(--cinza);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 5px;
    border-radius: 5px;
    transition: all 0.2s;
  }

  .pagamento-delete:hover { background: var(--vermelho-claro); color: var(--vermelho); }

  /* AÇÕES */
  .acoes-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--cinza-borda);
  }

  /* VENCIMENTO ALERTA */
  .vencimento-badge {
    font-size: 11px;
    font-weight: 500;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 3rem;
    color: var(--texto-muted);
  }

  .empty-state .icon { font-size: 48px; margin-bottom: 1rem; opacity: 0.4; }
  .empty-state p { font-size: 15px; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .modal-overlay.aberto { display: flex; }

  .modal {
    background: var(--branco);
    border-radius: 18px;
    padding: 2rem;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 1.5rem;
    color: var(--texto);
  }

  .modal-acoes {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 1.5rem;
  }

  /* SALDO DESTAQUE */
  .saldo-destaque {
    text-align: center;
    padding: 1.5rem;
    background: var(--rosa-claro);
    border-radius: 12px;
    margin-bottom: 1rem;
  }

  .saldo-label { font-size: 13px; color: var(--rosa-escuro); font-weight: 500; margin-bottom: 4px; }
  .saldo-valor { font-size: 32px; font-weight: 700; color: var(--rosa-escuro); font-variant-numeric: tabular-nums; }

  /* TABS PAGES */
  .page { display: none; }
  .page.ativa { display: block; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    main { padding: 1.25rem 1rem; }
    .tabs { display: none; }
    .mobile-tabs {
      display: flex;
      background: var(--branco);
      border-bottom: 1px solid var(--cinza-borda);
      padding: 0 1rem;
    }
    .mobile-tab {
      flex: 1;
      text-align: center;
      padding: 14px 0 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--texto-muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mobile-tab.active { color: var(--rosa); border-color: var(--rosa); }
    .form-grid { grid-template-columns: 1fr; }
  }

  @media (min-width: 601px) {
    .mobile-tabs { display: none; }
  }

  .whatsapp-preview {
    background: #e9f5e1;
    border-radius: 10px;
    padding: 1rem;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    color: #2d5a27;
    border: 1px solid #c5e3b2;
    margin-bottom: 1rem;
    font-family: monospace;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Minhas<span>Cobranças</span></div>
  <div class="tabs">
    <button class="tab-btn active" onclick="irPara('nova', this)">Nova Cobrança</button>
    <button class="tab-btn" onclick="irPara('lista', this)">Clientes</button>
    <button class="tab-btn" onclick="irPara('relatorio', this)">Resumo</button>
  </div>
</header>

<div class="mobile-tabs">
  <div class="mobile-tab active" onclick="irParaMobile('nova', this)">Nova</div>
  <div class="mobile-tab" onclick="irParaMobile('lista', this)">Clientes</div>
  <div class="mobile-tab" onclick="irParaMobile('relatorio', this)">Resumo</div>
</div>

<main>

  <!-- NOVA COBRANÇA -->
  <div class="page ativa" id="page-nova">
    <div class="form-section">
      <div class="form-title">Cadastrar nova cobrança</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Nome da cliente *</label>
          <input type="text" id="f-nome" placeholder="Ex: Maria Silva">
        </div>
        <div class="form-group">
          <label>WhatsApp da cliente</label>
          <input type="text" id="f-whatsapp" placeholder="Ex: 5582999998888">
        </div>
        <div class="form-group">
          <label>Valor total (R$) *</label>
          <input type="number" id="f-valor" placeholder="0,00" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>Data de vencimento</label>
          <input type="date" id="f-vencimento">
        </div>
      </div>
      <div class="form-group" style="margin-bottom: 14px;">
        <label>Descrição do produto/serviço *</label>
        <textarea id="f-descricao" placeholder="Ex: 3 peças de roupa — vestido floral, blusa e calça jeans"></textarea>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-primary" onclick="cadastrar()">✨ Cadastrar cobrança</button>
        <button class="btn btn-ghost" onclick="limparForm()">Limpar</button>
      </div>
    </div>

    <!-- DICA -->
    <div style="background: var(--amarelo-claro); border-radius: 12px; padding: 1rem 1.25rem; font-size: 13px; color: #633806; border: 1px solid #fac775;">
      💡 <strong>Dica:</strong> Após cadastrar, vá em <strong>Clientes</strong> para registrar os pagamentos e enviar o saldo pelo WhatsApp.
    </div>
  </div>

  <!-- LISTA -->
  <div class="page" id="page-lista">
    <div class="busca-row">
      <input type="text" id="busca" placeholder="🔍  Buscar cliente..." oninput="renderLista()">
      <select id="filtro-status" onchange="renderLista()" style="width: auto; min-width: 150px;">
        <option value="">Todas</option>
        <option value="pendente">Com saldo pendente</option>
        <option value="quitado">Quitadas</option>
        <option value="vencido">Vencidas</option>
      </select>
    </div>
    <div class="lista-section" id="lista-clientes"></div>
  </div>

  <!-- RELATÓRIO -->
  <div class="page" id="page-relatorio">
    <div class="resumo-grid" id="resumo-cards"></div>
    <div id="relatorio-lista"></div>
  </div>

</main>

<!-- MODAL EDITAR -->
<div class="modal-overlay" id="modal-editar">
  <div class="modal">
    <div class="modal-title">Editar cobrança</div>
    <input type="hidden" id="edit-id">
    <div class="form-grid">
      <div class="form-group">
        <label>Nome da cliente</label>
        <input type="text" id="edit-nome">
      </div>
      <div class="form-group">
        <label>WhatsApp</label>
        <input type="text" id="edit-whatsapp">
      </div>
      <div class="form-group">
        <label>Valor total (R$)</label>
        <input type="number" id="edit-valor" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>Vencimento</label>
        <input type="date" id="edit-vencimento">
      </div>
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <textarea id="edit-descricao"></textarea>
    </div>
    <div class="modal-acoes">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarEdicao()">Salvar alterações</button>
    </div>
  </div>
</div>

<!-- MODAL WHATSAPP -->
<div class="modal-overlay" id="modal-whatsapp">
  <div class="modal">
    <div class="modal-title">📲 Enviar pelo WhatsApp</div>
    <p style="font-size: 13px; color: var(--texto-muted); margin-bottom: 1rem;">Prévia da mensagem que será enviada:</p>
    <div class="whatsapp-preview" id="wp-preview"></div>
    <div class="form-group" style="margin-bottom: 1rem;">
      <label>Número WhatsApp (com código do país)</label>
      <input type="text" id="wp-numero" placeholder="Ex: 5582999998888">
    </div>
    <div class="modal-acoes">
      <button class="btn btn-ghost" onclick="document.getElementById('modal-whatsapp').classList.remove('aberto')">Cancelar</button>
      <button class="btn btn-whatsapp" onclick="abrirWhatsApp()">📲 Abrir WhatsApp</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'cobrancas_v2';
let dados = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let paginaAtual = 'nova';
let wpClienteId = null;

function salvar() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
}

function gerarId() {
  return '_' + Math.random().toString(36).substr(2, 9);
}

function fmt(v) {
  return 'R$ ' + Number(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function fmtData(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function iniciais(nome) {
  return nome.trim().split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
}

function statusVencimento(venc) {
  if (!venc) return null;
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  const v = new Date(venc + 'T00:00:00');
  const diff = Math.round((v - hoje) / 86400000);
  if (diff < 0) return { tipo: 'vencido', texto: `Venceu há ${Math.abs(diff)} dia(s)` };
  if (diff === 0) return { tipo: 'hoje', texto: 'Vence hoje!' };
  if (diff <= 3) return { tipo: 'proximo', texto: `Vence em ${diff} dia(s)` };
  return { tipo: 'ok', texto: `Vence em ${diff} dia(s)` };
}

function irPara(page, btn) {
  paginaAtual = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('ativa'));
  document.getElementById('page-' + page).classList.add('ativa');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (page === 'lista') renderLista();
  if (page === 'relatorio') renderRelatorio();
}

function irParaMobile(page, btn) {
  document.querySelectorAll('.mobile-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const tabBtns = document.querySelectorAll('.tab-btn');
  const pages = ['nova', 'lista', 'relatorio'];
  tabBtns.forEach((b, i) => { b.classList.toggle('active', pages[i] === page); });
  irPara(page, null);
}

function limparForm() {
  ['f-nome','f-whatsapp','f-valor','f-vencimento','f-descricao'].forEach(id => {
    document.getElementById(id).value = '';
  });
}

function cadastrar() {
  const nome = document.getElementById('f-nome').value.trim();
  const valor = parseFloat(document.getElementById('f-valor').value);
  const descricao = document.getElementById('f-descricao').value.trim();
  const whatsapp = document.getElementById('f-whatsapp').value.trim();
  const vencimento = document.getElementById('f-vencimento').value;

  if (!nome) { alert('Por favor, informe o nome da cliente.'); return; }
  if (!valor || valor <= 0) { alert('Por favor, informe o valor total.'); return; }
  if (!descricao) { alert('Por favor, informe a descrição.'); return; }

  dados.push({
    id: gerarId(),
    nome,
    whatsapp,
    valor,
    descricao,
    vencimento,
    pagamentos: [],
    criadoEm: new Date().toISOString()
  });

  salvar();
  limparForm();

  // Ir para lista
  const tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(b => b.classList.remove('active'));
  tabBtns[1].classList.add('active');
  irPara('lista', null);

  setTimeout(() => {
    const cards = document.querySelectorAll('.cliente-card');
    if (cards.length) {
      cards[0].scrollIntoView({ behavior: 'smooth' });
      cards[0].style.outline = '2px solid var(--rosa)';
      setTimeout(() => cards[0].style.outline = '', 2000);
    }
  }, 200);
}

function renderLista() {
  const busca = (document.getElementById('busca')?.value || '').toLowerCase();
  const filtro = document.getElementById('filtro-status')?.value || '';
  const container = document.getElementById('lista-clientes');

  let lista = dados.filter(c => c.nome.toLowerCase().includes(busca));

  if (filtro === 'pendente') lista = lista.filter(c => totalPago(c) < c.valor);
  if (filtro === 'quitado') lista = lista.filter(c => totalPago(c) >= c.valor);
  if (filtro === 'vencido') lista = lista.filter(c => {
    const s = statusVencimento(c.vencimento);
    return s && s.tipo === 'vencido' && totalPago(c) < c.valor;
  });

  // Ordenar: vencidos primeiro, depois por vencimento
  lista.sort((a, b) => {
    const pa = totalPago(a) >= a.valor ? 1 : 0;
    const pb = totalPago(b) >= b.valor ? 1 : 0;
    if (pa !== pb) return pa - pb;
    if (a.vencimento && b.vencimento) return a.vencimento.localeCompare(b.vencimento);
    return 0;
  });

  if (!lista.length) {
    container.innerHTML = `<div class="empty-state">
      <div class="icon">💸</div>
      <p>${dados.length === 0 ? 'Nenhuma cobrança cadastrada ainda.' : 'Nenhuma cliente encontrada com esse filtro.'}</p>
    </div>`;
    return;
  }

  container.innerHTML = lista.map(c => cardCliente(c)).join('');
}

function totalPago(c) {
  return (c.pagamentos || []).reduce((s, p) => s + p.valor, 0);
}

function saldoRestante(c) {
  return Math.max(0, c.valor - totalPago(c));
}

function cardCliente(c) {
  const pago = totalPago(c);
  const restante = saldoRestante(c);
  const pct = Math.min(100, Math.round((pago / c.valor) * 100));
  const quitado = restante <= 0;
  const sv = statusVencimento(c.vencimento);

  let badgeStatus = '';
  if (quitado) {
    badgeStatus = `<span class="badge badge-verde">✓ Quitada</span>`;
  } else if (sv && sv.tipo === 'vencido') {
    badgeStatus = `<span class="badge badge-vermelho">⚠ ${sv.texto}</span>`;
  } else if (sv && sv.tipo === 'hoje') {
    badgeStatus = `<span class="badge badge-vermelho">🔴 Vence hoje</span>`;
  } else if (sv && sv.tipo === 'proximo') {
    badgeStatus = `<span class="badge badge-amarelo">⏰ ${sv.texto}</span>`;
  } else if (sv) {
    badgeStatus = `<span class="badge" style="background:#f1efe8;color:#444">${sv.texto}</span>`;
  }

  const pgsHtml = (c.pagamentos || []).map((p, i) => `
    <div class="pagamento-item">
      <span class="pagamento-valor">${fmt(p.valor)}</span>
      <span class="pagamento-data">${fmtData(p.data)}${p.obs ? ' · ' + p.obs : ''}</span>
      <button class="pagamento-delete" onclick="deletarPagamento('${c.id}', ${i})" title="Remover pagamento">×</button>
    </div>
  `).join('');

  return `
  <div class="cliente-card" id="card-${c.id}">
    <div class="cliente-header" onclick="toggleCard('${c.id}')">
      <div class="avatar">${iniciais(c.nome)}</div>
      <div class="cliente-info">
        <div class="cliente-nome">${c.nome}</div>
        <div class="cliente-meta">
          <span>Total: <strong>${fmt(c.valor)}</strong></span>
          <span>Pago: <strong style="color:var(--verde)">${fmt(pago)}</strong></span>
          ${!quitado ? `<span>Falta: <strong style="color:var(--rosa)">${fmt(restante)}</strong></span>` : ''}
          ${badgeStatus}
        </div>
      </div>
      <span class="chevron">▾</span>
    </div>

    <div class="cliente-body">
      <p style="font-size:13px;color:var(--texto-muted);margin:12px 0 8px;"><strong style="color:var(--texto)">Produto/Serviço:</strong> ${c.descricao}</p>
      ${c.vencimento ? `<p style="font-size:13px;color:var(--texto-muted);margin-bottom:8px;"><strong style="color:var(--texto)">Vencimento:</strong> ${fmtData(c.vencimento)}</p>` : ''}

      <div class="progresso-section">
        <div class="progresso-row">
          <span style="font-size:13px;color:var(--texto-muted)">Progresso</span>
          <span style="font-size:13px;font-weight:600;color:${quitado ? 'var(--verde)' : 'var(--rosa)'}">${pct}%</span>
        </div>
        <div class="barra-container">
          <div class="barra-fill ${quitado ? 'completo' : ''}" style="width:${pct}%"></div>
        </div>
        ${!quitado ? `<div style="text-align:center;font-size:13px;"><strong style="color:var(--rosa);font-size:15px">${fmt(restante)}</strong> ainda por pagar</div>` : `<div style="text-align:center;font-size:13px;color:var(--verde)">✓ Cobrança quitada!</div>`}
      </div>

      ${!quitado ? `
      <div class="pagamentos-title">Registrar pagamento</div>
      <div class="pagamento-form">
        <div class="form-group">
          <label>Valor recebido (R$)</label>
          <input type="number" id="pg-valor-${c.id}" placeholder="0,00" min="0.01" step="0.01" max="${restante}">
        </div>
        <div class="form-group">
          <label>Data</label>
          <input type="date" id="pg-data-${c.id}" value="${new Date().toISOString().split('T')[0]}">
        </div>
        <div class="form-group">
          <label>Observação (opcional)</label>
          <input type="text" id="pg-obs-${c.id}" placeholder="Ex: Pix, dinheiro...">
        </div>
        <button class="btn btn-verde" onclick="registrarPagamento('${c.id}')">+ Registrar</button>
      </div>` : ''}

      ${pgsHtml ? `<div class="pagamentos-title">Pagamentos registrados</div>${pgsHtml}` : ''}

      <div class="acoes-row">
        <button class="btn btn-whatsapp" onclick="prepararWhatsapp('${c.id}')">📲 Enviar saldo no WhatsApp</button>
        <button class="btn btn-ghost" onclick="editarCliente('${c.id}')">✏️ Editar</button>
        <button class="btn btn-danger" onclick="excluirCliente('${c.id}')">🗑 Excluir</button>
      </div>
    </div>
  </div>`;
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  card.classList.toggle('aberto');
}

function registrarPagamento(id) {
  const valorEl = document.getElementById('pg-valor-' + id);
  const dataEl = document.getElementById('pg-data-' + id);
  const obsEl = document.getElementById('pg-obs-' + id);
  const valor = parseFloat(valorEl.value);
  const data = dataEl.value;

  if (!valor || valor <= 0) { alert('Informe um valor válido.'); return; }

  const c = dados.find(x => x.id === id);
  if (!c) return;

  if (!c.pagamentos) c.pagamentos = [];
  c.pagamentos.push({ valor, data, obs: obsEl.value.trim() });
  salvar();
  renderLista();

  setTimeout(() => {
    const card = document.getElementById('card-' + id);
    if (card) { card.classList.add('aberto'); card.scrollIntoView({ behavior: 'smooth' }); }
  }, 100);
}

function deletarPagamento(clienteId, pgIdx) {
  if (!confirm('Remover este pagamento?')) return;
  const c = dados.find(x => x.id === clienteId);
  if (c) { c.pagamentos.splice(pgIdx, 1); salvar(); renderLista(); }
  setTimeout(() => {
    const card = document.getElementById('card-' + clienteId);
    if (card) card.classList.add('aberto');
  }, 100);
}

function excluirCliente(id) {
  if (!confirm('Tem certeza que deseja excluir esta cobrança? Esta ação não pode ser desfeita.')) return;
  dados = dados.filter(c => c.id !== id);
  salvar();
  renderLista();
}

function editarCliente(id) {
  const c = dados.find(x => x.id === id);
  if (!c) return;
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-nome').value = c.nome;
  document.getElementById('edit-whatsapp').value = c.whatsapp || '';
  document.getElementById('edit-valor').value = c.valor;
  document.getElementById('edit-vencimento').value = c.vencimento || '';
  document.getElementById('edit-descricao').value = c.descricao;
  document.getElementById('modal-editar').classList.add('aberto');
}

function fecharModal() {
  document.getElementById('modal-editar').classList.remove('aberto');
}

function salvarEdicao() {
  const id = document.getElementById('edit-id').value;
  const c = dados.find(x => x.id === id);
  if (!c) return;
  c.nome = document.getElementById('edit-nome').value.trim();
  c.whatsapp = document.getElementById('edit-whatsapp').value.trim();
  c.valor = parseFloat(document.getElementById('edit-valor').value);
  c.vencimento = document.getElementById('edit-vencimento').value;
  c.descricao = document.getElementById('edit-descricao').value.trim();
  salvar();
  fecharModal();
  renderLista();
  setTimeout(() => {
    const card = document.getElementById('card-' + id);
    if (card) card.classList.add('aberto');
  }, 100);
}

function prepararWhatsapp(id) {
  wpClienteId = id;
  const c = dados.find(x => x.id === id);
  if (!c) return;

  const pago = totalPago(c);
  const restante = saldoRestante(c);
  const quitado = restante <= 0;
  const sv = statusVencimento(c.vencimento);

  let msg = `Olá, ${c.nome}! 😊\n\n`;
  msg += `Segue o resumo da sua compra:\n`;
  msg += `📦 *${c.descricao}*\n\n`;
  msg += `💰 Valor total: *${fmt(c.valor)}*\n`;
  msg += `✅ Valor pago: *${fmt(pago)}*\n`;

  if (quitado) {
    msg += `\n🎉 Sua compra está *QUITADA*! Obrigada! ❤️`;
  } else {
    msg += `🔴 Valor restante: *${fmt(restante)}*\n`;
    if (c.vencimento) msg += `📅 Vencimento: *${fmtData(c.vencimento)}*\n`;
    if (sv && sv.tipo === 'vencido') {
      msg += `\n⚠️ Atenção: esta cobrança está vencida. Qualquer dúvida, me chame! 🙏`;
    } else {
      msg += `\nQualquer dúvida, estou à disposição! 😊`;
    }
  }

  document.getElementById('wp-preview').textContent = msg;
  document.getElementById('wp-numero').value = c.whatsapp || '';
  document.getElementById('modal-whatsapp').classList.add('aberto');
}

function abrirWhatsApp() {
  const c = dados.find(x => x.id === wpClienteId);
  if (!c) return;

  const pago = totalPago(c);
  const restante = saldoRestante(c);
  const quitado = restante <= 0;
  const sv = statusVencimento(c.vencimento);

  let msg = `Olá, ${c.nome}! 😊\n\nSegue o resumo da sua compra:\n📦 *${c.descricao}*\n\n💰 Valor total: *${fmt(c.valor)}*\n✅ Valor pago: *${fmt(pago)}*\n`;

  if (quitado) {
    msg += `\n🎉 Sua compra está *QUITADA*! Obrigada! ❤️`;
  } else {
    msg += `🔴 Valor restante: *${fmt(restante)}*\n`;
    if (c.vencimento) msg += `📅 Vencimento: *${fmtData(c.vencimento)}*\n`;
    if (sv && sv.tipo === 'vencido') {
      msg += `\n⚠️ Atenção: esta cobrança está vencida. Qualquer dúvida, me chame! 🙏`;
    } else {
      msg += `\nQualquer dúvida, estou à disposição! 😊`;
    }
  }

  let numero = document.getElementById('wp-numero').value.replace(/\D/g, '');
  if (!numero) { alert('Informe o número do WhatsApp da cliente.'); return; }

  const url = `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  document.getElementById('modal-whatsapp').classList.remove('aberto');
}

function renderRelatorio() {
  const total = dados.reduce((s, c) => s + c.valor, 0);
  const recebido = dados.reduce((s, c) => s + totalPago(c), 0);
  const pendente = dados.reduce((s, c) => s + saldoRestante(c), 0);
  const vencidas = dados.filter(c => {
    const sv = statusVencimento(c.vencimento);
    return sv && sv.tipo === 'vencido' && saldoRestante(c) > 0;
  }).length;

  document.getElementById('resumo-cards').innerHTML = `
    <div class="resumo-card rosa">
      <div class="resumo-label">Total cobrado</div>
      <div class="resumo-valor">${fmt(total)}</div>
    </div>
    <div class="resumo-card verde">
      <div class="resumo-label">Total recebido</div>
      <div class="resumo-valor">${fmt(recebido)}</div>
    </div>
    <div class="resumo-card vermelho">
      <div class="resumo-label">A receber</div>
      <div class="resumo-valor">${fmt(pendente)}</div>
    </div>
    <div class="resumo-card amarelo">
      <div class="resumo-label">Cobranças vencidas</div>
      <div class="resumo-valor">${vencidas}</div>
    </div>
  `;

  // Pendentes ordenadas por valor
  const pendentes = dados.filter(c => saldoRestante(c) > 0)
    .sort((a, b) => saldoRestante(b) - saldoRestante(a));

  if (!pendentes.length) {
    document.getElementById('relatorio-lista').innerHTML = `
      <div style="text-align:center;padding:2rem;color:var(--verde);font-size:15px;">🎉 Nenhuma cobrança pendente!</div>`;
    return;
  }

  document.getElementById('relatorio-lista').innerHTML = `
    <div style="font-size:13px;font-weight:600;color:var(--texto-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">Cobranças em aberto</div>
    ${pendentes.map(c => {
      const sv = statusVencimento(c.vencimento);
      const corStatus = sv && sv.tipo === 'vencido' ? 'var(--vermelho)' : sv && sv.tipo === 'proximo' ? 'var(--amarelo)' : 'var(--texto-muted)';
      return `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--branco);border:1px solid var(--cinza-borda);border-radius:10px;margin-bottom:8px;gap:12px;flex-wrap:wrap;">
        <div>
          <div style="font-weight:600;font-size:14px;margin-bottom:2px;">${c.nome}</div>
          <div style="font-size:12px;color:var(--texto-muted);">${c.descricao.substring(0,50)}${c.descricao.length > 50 ? '...' : ''}</div>
          ${sv ? `<div style="font-size:11px;color:${corStatus};margin-top:2px;">${sv.texto}</div>` : ''}
        </div>
        <div style="text-align:right;">
          <div style="font-size:16px;font-weight:700;color:var(--rosa);">${fmt(saldoRestante(c))}</div>
          <div style="font-size:11px;color:var(--texto-muted);">de ${fmt(c.valor)}</div>
        </div>
      </div>`;
    }).join('')}`;
}

// Fechar modais ao clicar fora
document.getElementById('modal-editar').addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});
document.getElementById('modal-whatsapp').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('aberto');
});

// Inicializar
renderLista();
</script>
</body>
</html>
